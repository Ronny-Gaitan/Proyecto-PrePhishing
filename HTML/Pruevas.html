<!DOCTYPE html>
<html>
<head>
    <title>Pruebas de Phishing</title>
    <link rel="stylesheet" href="../CSS/Pruevas.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
</head>
<body>
    <main>
        <header class="header">
            <div class="container">
                <a href="..\index.html" class="logo">
                    <img src="..\recursos\Logo_2_simple.jpg" alt="Deepcore" width="85" height="70">
                </a>
            </div>
        </header>

        <div id="btn-regresar">   
            <div id="btn-regresar-icon">
                <i class="fas fa-arrow-left"></i>
                Regresar
            </div>
            <script>
                document.getElementById("btn-regresar-icon").addEventListener("click", function() {
                    window.location.href = "Panel_usuario.html"; 
                });
            </script>
        </div>

        <section class="titulo">
            <h1>Pruebas de Phishing</h1>
        </section>

        <!-- Contenido principal -->

            <span  class="titulo-panel">
                <span id="titulo-prueBas">Phishingquiz</span>                 
            </span>
            <div id="conten-test" class="user-test">
                <img src="../recursos/Pruevas.png" alt="Pruevas"  width="600" height="135">

            <div id="link-pruebas" >

                </span>
                
                <div id="contenedor-pruebas">

                    <div id="Smartfense" class="user-test">
                        <img src="../recursos/PRD-358-274-801-logo_IxJZNX4.png" alt="Avatar" width="400" height="100" class="avatar">
                    </div>
                </div>

            </div>
            <!-- Script para redirigir al enlace de Phishingquiz de google-->
            <script> 
                document.getElementById("conten-test").addEventListener("click", function() {
                    window.location.href = "https://phishingquiz.withgoogle.com/?hl=es"; 
                }); 
            </script> 
            <!-- Script para redirigir al enlace de Hackmetrix -->
            <script>
                document.getElementById("Hackmetrix").addEventListener("click", function() {
                    window.location.href = "https://test-phishing.hackmetrix.com/"; 
                });
            </script>
            <!-- Script para redirigir al enlace de el juego del pescadito -->
            <script>
                document.getElementById("Smartfense_game1").addEventListener("click", function() {
                    window.location.href = "https://gupi-adventures.smartfense.com/";
