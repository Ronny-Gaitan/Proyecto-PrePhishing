<!DOCTYPE html>
<html>
    <head>
        <title>Panel de Usuario</title>
        <link rel="stylesheet" href="..\CSS\Panel_usuario.css"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <meta charset="UTF-8">
    </head>

    <body>
        <header class="header">
            <div class="container">
                <a href="..\index.html" class="logo">
                    <img src="..\recursos\Logo_2_simple.jpg" alt="Deepcore" width="85" height="70">
                </a>
                <!-- Si necesitas agregar navegación, agrégala aquí -->
            </div>
        </header>

        <main>
            <!-- Barra lateral -->
            <div class="container-lateral hidden">
                <ul>
                    <li><a href="Panel_usuario.html"><i class="fas fa-home"></i>&nbsp; Inicio</a></li>
                    <li><a href="#"><i class="fas fa-user"></i>&nbsp; Perfil</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i>&nbsp; Configuración</a></li>
                    <li><a href="Log In.html"><i class="fas fa-sign-out-alt"></i>&nbsp; Salir</a></li>
                </ul>
            </div>
            <button class="btn-barra-lateral"><!-- Botón para abrir/cerrar la barra lateral -->
                <i class="fas fa-bars"></i>
            </button>

            <!-- Script para abrir/cerrar la barra lateral -->
            <script>
                document.querySelector('.btn-barra-lateral').addEventListener('click', function() {
                    document.querySelector('.container-lateral').classList.toggle('hidden');
                });
            </script>

            <div class="container-main">
                <span id="titulo-panel-usuario" class="titulo-panel">
                    <span>Tablero</span>                 
                </span>
                <!-- Contenido del panel de usuario -->
                <section class="user-dashboard">
                    
                    <div id="conten-AAW" class="user-content">
                        <p class="tex-conten">Ataques de aplicaciones web</p>
                    </div>
                    <div id="conten-P-para-E" class="user-content">
                        <p class="tex-conten">Phishing para empresas</p>
                    </div>   
                    <script>
                        document.getElementById("conten-AAW").addEventListener("click", function() {
                            window.location.href = "Contenido1.html"; 
                        });
                    </script>
                    <script>
                        document.getElementById("conten-P-para-E").addEventListener("click", function() {
                            window.location.href = "Contenido2.html"; 
                        }); 
                    </script>
                </section>  
               <section id="Pruevas" class="Barra-pruevas">
                    <span  class="titulo-panel">
                        <span id="titulo-prueBas">Pruebas</span>                 
                    </span>
                    <div id="conten-test" class="user-test">
                        <img src="../recursos/Pruevas.png" alt="Pruevas"  width="600" height="135">
                    </div> 
                    <script>
                        document.getElementById("Pruevas").addEventListener("click", function() {
                            window.location.href = "Pruevas.html"; 
                        });
                    </script>  
            </div>
        </main>
    </body>
</html>
